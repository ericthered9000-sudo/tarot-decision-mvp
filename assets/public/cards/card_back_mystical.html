<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=220, height=370">
  <title>Tarot Card Back - Mystical Design</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 220px;
      height: 370px;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }
    
    /* Card Background */
    .card-back {
      width: 220px;
      height: 370px;
      position: relative;
      background: 
        radial-gradient(ellipse at 50% 30%, rgba(147, 51, 234, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 70%, rgba(99, 27, 132, 0.3) 0%, transparent 60%),
        linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      border: 3px solid #d4af37;
      border-radius: 12px;
      overflow: hidden;
    }
    
    /* Inner Border Frame */
    .inner-frame {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      bottom: 12px;
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    
    /* Corner Ornaments */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      font-size: 20px;
      color: #d4af37;
      opacity: 0.8;
    }
    
    .corner-tl { top: 16px; left: 16px; }
    .corner-tr { top: 16px; right: 16px; }
    .corner-bl { bottom: 16px; left: 16px; }
    .corner-br { bottom: 16px; right: 16px; }
    
    /* Central Symbol */
    .symbol {
      font-size: 80px;
      color: #d4af37;
      text-shadow: 
        0 0 20px rgba(212, 175, 55, 0.8),
        0 0 40px rgba(212, 175, 55, 0.5),
        0 0 60px rgba(147, 51, 234, 0.6);
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        transform: scale(1);
        filter: brightness(1);
      }
      50% { 
        transform: scale(1.05);
        filter: brightness(1.2);
      }
    }
    
    /* Decorative Border Pattern */
    .border-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .border-pattern::before,
    .border-pattern::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(212, 175, 55, 0.6) 20%,
        #d4af37 50%,
        rgba(212, 175, 55, 0.6) 80%,
        transparent 100%
      );
    }
    
    .border-pattern::before {
      top: 50px;
    }
    
    .border-pattern::after {
      bottom: 50px;
    }
    
    /* Mystical Text */
    .text {
      font-family: 'Georgia', serif;
      font-size: 11px;
      color: #d4af37;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 15px;
      opacity: 0.8;
    }
    
    /* Subtle Stars */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    
    .star-1 { top: 40px; left: 40px; width: 2px; height: 2px; animation-delay: 0s; }
    .star-2 { top: 60px; right: 45px; width: 2px; height: 2px; animation-delay: 0.4s; }
    .star-3 { bottom: 80px; left: 50px; width: 2px; height: 2px; animation-delay: 0.8s; }
    .star-4 { bottom: 60px; right: 55px; width: 2px; height: 2px; animation-delay: 1.2s; }
    .star-5 { top: 100px; left: 30px; width: 1px; height: 1px; animation-delay: 0.6s; }
    .star-6 { bottom: 120px; right: 35px; width: 1px; height: 1px; animation-delay: 1s; }
  </style>
</head>
<body>
  <div class="card-back">
    <!-- Subtle Stars Background -->
    <div class="stars">
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-4"></div>
      <div class="star star-5"></div>
      <div class="star star-6"></div>
    </div>
    
    <!-- Decorative Border Lines -->
    <div class="border-pattern"></div>
    
    <!-- Inner Frame -->
    <div class="inner-frame">
      <!-- Corner Ornaments -->
      <div class="corner corner-tl">✧</div>
      <div class="corner corner-tr">✧</div>
      <div class="corner corner-bl">✧</div>
      <div class="corner corner-br">✧</div>
      
      <!-- Central Symbol -->
      <div class="symbol">☽</div>
      
      <!-- Mystical Text -->
      <div class="text">Decision Tarot</div>
    </div>
  </div>
</body>
</html>
