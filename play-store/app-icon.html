<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=512">
  <title>Decision Tarot - App Icon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 512px;
      height: 512px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Cinzel', serif;
      position: relative;
    }
    
    /* Background Gradient */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at 30% 30%, rgba(147, 51, 234, 0.4) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 70%, rgba(99, 27, 132, 0.3) 0%, transparent 60%),
        linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }
    
    /* Outer Glow Ring */
    .glow-ring {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      border: 4px solid rgba(255, 215, 0, 0.3);
      box-shadow: 
        0 0 40px rgba(255, 215, 0, 0.4),
        inset 0 0 40px rgba(255, 215, 0, 0.2);
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        transform: scale(1);
        opacity: 0.8;
      }
      50% { 
        transform: scale(1.05);
        opacity: 1;
      }
    }
    
    /* Inner Glow Ring */
    .glow-ring-inner {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      border: 2px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }
    
    /* Crystal Ball Container */
    .crystal-ball {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(
        circle at 30% 30%,
        rgba(255, 255, 255, 0.9) 0%,
        rgba(255, 255, 255, 0.6) 10%,
        rgba(147, 51, 234, 0.5) 40%,
        rgba(79, 70, 229, 0.7) 70%,
        rgba(15, 12, 41, 0.9) 100%
      );
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(147, 51, 234, 0.6),
        inset 0 0 60px rgba(255, 255, 255, 0.2),
        inset 0 0 100px rgba(147, 51, 234, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      overflow: hidden;
    }
    
    /* Crystal Ball Highlight */
    .crystal-ball::before {
      content: '';
      position: absolute;
      top: 60px;
      left: 80px;
      width: 80px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(
        ellipse,
        rgba(255, 255, 255, 0.8) 0%,
        rgba(255, 255, 255, 0.4) 50%,
        transparent 100%
      );
      transform: rotate(-45deg);
      filter: blur(2px);
    }
    
    /* Tarot Card Symbol Inside Crystal Ball */
    .card-symbol {
      font-size: 140px;
      filter: 
        drop-shadow(0 0 20px rgba(255, 215, 0, 0.8))
        drop-shadow(0 0 40px rgba(255, 215, 0, 0.5));
      animation: float 4s ease-in-out infinite;
      z-index: 3;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    /* Mystical Stars Around Crystal Ball */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    
    .star-1 { top: 80px; left: 100px; width: 6px; height: 6px; animation-delay: 0s; }
    .star-2 { top: 120px; right: 90px; width: 4px; height: 4px; animation-delay: 0.5s; }
    .star-3 { bottom: 100px; left: 110px; width: 5px; height: 5px; animation-delay: 1s; }
    .star-4 { bottom: 140px; right: 100px; width: 4px; height: 4px; animation-delay: 1.5s; }
    .star-5 { top: 200px; left: 60px; width: 3px; height: 3px; animation-delay: 0.3s; }
    .star-6 { top: 180px; right: 70px; width: 4px; height: 4px; animation-delay: 0.8s; }
    
    /* Bottom Glow */
    .bottom-glow {
      position: absolute;
      bottom: 40px;
      width: 400px;
      height: 100px;
      background: radial-gradient(ellipse, rgba(147, 51, 234, 0.4) 0%, transparent 70%);
      filter: blur(20px);
      z-index: 1;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="background"></div>
  
  <!-- Bottom Glow -->
  <div class="bottom-glow"></div>
  
  <!-- Outer Glow Ring -->
  <div class="glow-ring"></div>
  
  <!-- Inner Glow Ring -->
  <div class="glow-ring-inner"></div>
  
  <!-- Crystal Ball -->
  <div class="crystal-ball">
    <!-- Tarot Card Symbol (The Fool - new beginnings, decisions) -->
    <div class="card-symbol">🃏</div>
  </div>
  
  <!-- Mystical Stars -->
  <div class="star star-1"></div>
  <div class="star star-2"></div>
  <div class="star star-3"></div>
  <div class="star star-4"></div>
  <div class="star star-5"></div>
  <div class="star star-6"></div>
</body>
</html>
