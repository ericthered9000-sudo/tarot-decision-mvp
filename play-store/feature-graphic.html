<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Decision Tarot - Feature Graphic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 1024px;
      height: 500px;
      overflow: hidden;
      font-family: 'Quicksand', sans-serif;
      position: relative;
    }
    
    /* Background Gradient */
    .background {
      position: absolute;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(ellipse at top, rgba(99, 27, 132, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at bottom, rgba(236, 72, 153, 0.2) 0%, transparent 50%),
        linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    }
    
    /* Stars */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s ease-in-out infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    /* Content Container */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }
    
    /* Title */
    .title {
      font-family: 'Cinzel', serif;
      font-size: 72px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 0 0 60px rgba(255, 215, 0, 0.3);
      letter-spacing: 8px;
      margin-bottom: 10px;
      text-align: center;
    }
    
    /* Subtitle */
    .subtitle {
      font-family: 'Quicksand', sans-serif;
      font-size: 24px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 50px;
      text-transform: uppercase;
    }
    
    /* Cards Container */
    .cards-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }
    
    /* Card Back Design */
    .card {
      width: 120px;
      height: 200px;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border: 3px solid rgba(255, 215, 0, 0.4);
    }
    
    .card.back {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .card.back::before {
      content: '🔮';
      font-size: 48px;
      opacity: 0.6;
    }
    
    .card.back::after {
      content: '';
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 2px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
    }
    
    /* Center Card - Revealed (The Fool) */
    .card.revealed {
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
      transform: translateY(-20px) scale(1.1);
      z-index: 2;
      overflow: hidden;
    }
    
    .card.revealed .card-art {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    
    .card.revealed .card-symbol {
      font-size: 64px;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
    }
    
    .card.revealed .card-name {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #ffd700;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
    }
    
    .card.revealed .card-orientation {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.7);
      font-style: italic;
      margin-top: 5px;
    }
    
    /* Glow Effect */
    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 3s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.8;
      }
    }
    
    /* Bottom Accent */
    .bottom-accent {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: linear-gradient(to top, rgba(147, 51, 234, 0.3) 0%, transparent 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="background"></div>
  
  <!-- Stars -->
  <div class="stars" id="stars"></div>
  
  <!-- Glow Effect -->
  <div class="glow"></div>
  
  <!-- Content -->
  <div class="container">
    <!-- Title -->
    <div class="title">DECISION TAROT</div>
    
    <!-- Subtitle -->
    <div class="subtitle">Clarity at Life's Crossroads</div>
    
    <!-- Cards -->
    <div class="cards-container">
      <!-- Left Card (Face Down) -->
      <div class="card back" style="transform: rotate(-10deg);"></div>
      
      <!-- Center Card (Revealed - The Fool) -->
      <div class="card revealed">
        <div class="card-art">
          <div class="card-symbol">🃏</div>
          <div class="card-name">The Fool</div>
          <div class="card-orientation">Upright</div>
        </div>
      </div>
      
      <!-- Right Card (Face Down) -->
      <div class="card back" style="transform: rotate(10deg);"></div>
    </div>
  </div>
  
  <!-- Bottom Accent -->
  <div class="bottom-accent"></div>
  
  <!-- Generate Stars -->
  <script>
    const starsContainer = document.getElementById('stars');
    const starCount = 80;
    
    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      
      // Random position
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      
      // Random size (1-3px)
      const size = Math.random() * 2 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      
      // Random animation delay
      star.style.animationDelay = (Math.random() * 2) + 's';
      
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
